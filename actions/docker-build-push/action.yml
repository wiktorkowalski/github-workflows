name: Docker Build and Push
description: Build and push Docker image to GHCR with buildx and GHA cache

inputs:
  image-name:
    description: Image name without registry (e.g. wiktorkowalski/myapp)
    required: true
  dockerfile:
    description: Path to Dockerfile
    required: false
    default: "./Dockerfile"
  context:
    description: Docker build context
    required: false
    default: "."
  push:
    description: Whether to push the image
    required: false
    default: "true"
  build-args:
    description: Docker build arguments (newline-separated)
    required: false
    default: ""
  registry-password:
    description: GHCR password (typically secrets.GITHUB_TOKEN)
    required: true
  platforms:
    description: >-
      Comma-separated target platforms (e.g. linux/amd64,linux/arm64). Non-native
      targets need a Dockerfile that cross-compiles (FROM --platform=$BUILDPLATFORM
      on build stages); only stages without --platform run under QEMU.
    required: false
    default: "linux/amd64"

runs:
  using: composite
  steps:
    # binfmt for the target arches, so RUN steps in target-native stages (e.g. apt-get in
    # a runtime stage) can execute under emulation. Not registered when the only platform
    # is the runner's own.
    - name: Set up QEMU
      if: inputs.platforms != 'linux/amd64'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry-password }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ inputs.image-name }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix=

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: ${{ inputs.platforms }}
